; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = m5stack

[env]
platform = espressif32@7.1.3
board = m5stack-core-esp32
framework = arduino
platform_packages =
	platformio/framework-arduinoespressif32@4.20017.260907+sha.dcc1105b
	espressif/toolchain-xtensa-esp32@8.4.0+2021r2-patch5
	platformio/tool-esptoolpy@2.41100.260830
lib_deps = 
	m5stack/M5Stack@0.4.6
	adafruit/Adafruit BusIO@1.17.4
	knolleary/PubSubClient@2.8
monitor_speed = 115200

[env:m5stack]

[env:validation]
build_flags = -DPRESSURE_TEST_CONFIG
